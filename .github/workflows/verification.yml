name: MeetPoint verification

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  client:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:13001

  solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/solver
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo test --locked

  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: meetpoint_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U meetpoint_test -d postgres"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql://meetpoint_test:test-only-password@localhost:5432/postgres
      RUN_CALCULATION_E2E: 'true'
      SOLVER_BASE_URL: http://localhost:14000
      SOLVER_PORT: '14000'
      CALCULATION_JOB_POLL_INTERVAL_MS: '100'
    defaults:
      run:
        working-directory: services/server
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: services/server/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:check
      - run: pnpm test --runInBand
      - run: pnpm build
      - name: Isolated PostgreSQL + actual Solver integration
        shell: bash
        run: |
          cargo build --locked --manifest-path ../solver/Cargo.toml
          ../solver/target/debug/solver > /dev/null 2>&1 &
          solver_pid=$!
          trap 'kill "$solver_pid" 2>/dev/null || true' EXIT INT TERM
          node test/wait-service.cjs "$SOLVER_BASE_URL/health" solver "$solver_pid"
          node test/service-readiness.test.cjs
          pnpm test:integration

  browser:
    needs: [client, server, solver]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: |
            client/pnpm-lock.yaml
            services/server/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - run: pnpm --dir client install --frozen-lockfile
      - run: pnpm --dir services/server install --frozen-lockfile
      - run: pnpm --dir client exec playwright install --with-deps chromium
      - name: Real browser with owned services and temporary DB
        run: pnpm --dir client test:e2e
      # 자격 증명이 포함될 수 있는 원본 진단 자료는 업로드하지 않는다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-safe-summary
          path: client/test-results/safe-summary.json
          if-no-files-found: ignore
          retention-days: 7

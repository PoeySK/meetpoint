name: meetpoint

services:
  meetpoint-postgres:
    container_name: meetpoint-postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meetpoint}
      POSTGRES_USER: ${POSTGRES_USER:-meetpoint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-meetpoint-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - meetpoint-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  default:
    name: meetpoint-network

volumes:
  meetpoint-postgres-data:
    name: meetpoint-postgres-data
